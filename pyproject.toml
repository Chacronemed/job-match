[project]
name = "job-match"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "respx>=0.21",
    "pytest-xdist>=3.6",  # ci.yml: pytest -n auto
    "playwright>=1.48",
    "fonttools>=4.68",  # scripts/build_pdf_fonts.py, reproducible PDF fonts (ADR 0019)
]

[project.scripts]
job-match = "job_match.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_match"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# ci.yml splits on these: the "fast" job runs `-m "not browser and not worker"`, the
# "browser-worker" job the rest. Unmarked locally, `pytest -q` still runs everything.
markers = [
    "browser: drives the dashboard in Chromium (Playwright); set on tests/unit/browser/",
    "worker: runs Node (the Worker's tests or its npm dependencies)",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
