# Company career boards read through their ATS's public JSON endpoint (ADR 0020).
# Public, unauthenticated, documented endpoints only: boards-api.greenhouse.io,
# api.lever.co/v0/postings, api.ashbyhq.com/posting-api. No HTML scraping.
#
# Every slug below was verified on 2026-11-04 with `scripts/ats_probe.py`: each board
# answered 200 with at least one posting. Re-run the probe before adding a slug; a board
# that answers 404 is skipped at run time with a warning, never a crash.
#
# Offers from every office of these companies are fetched; the location gate keeps the
# French ones, like for any other source.
boards:
  # Greenhouse — https://boards-api.greenhouse.io/v1/boards/<slug>/jobs?content=true
  - {company: Dataiku,          ats: greenhouse, slug: dataiku}
  - {company: Algolia,          ats: greenhouse, slug: algolia}
  - {company: Ivalua,           ats: greenhouse, slug: ivalua}
  - {company: Platform.sh,      ats: greenhouse, slug: platformsh}
  - {company: Shift Technology, ats: greenhouse, slug: shifttechnology}
  - {company: Mirakl,           ats: greenhouse, slug: mirakl}
  - {company: Dashlane,         ats: greenhouse, slug: dashlane}
  # Lever — https://api.lever.co/v0/postings/<slug>
