# Company career boards read through their ATS's public JSON endpoint (ADR 0020).
# Public, unauthenticated endpoints only: boards-api.greenhouse.io, api.lever.co/v0/postings,
# api.ashbyhq.com/posting-api, api.smartrecruiters.com/v1, Workday's /wday/cxs/ JSON and
# the offers RSS feed a Talentsoft career site publishes (ADR 0029).
# No HTML scraping.
#
# Every board below answered 200 with at least one posting: the first 30 on 2026-11-04
# (`scripts/ats_probe.py`), the rest on 2026-11-05 (`job-match companies detect`, results in
# config/companies_detected.yaml), the ten Workday boards again on 2026-11-20 together with
# Murex, Sopra Steria, Inetum and Air France (docs/diagnostics/2026-11-20-coverage.md).
# Re-check before adding one; a board that answers 404 is skipped at run time with a
# warning, never a crash.
#
# Greenhouse / Lever / Ashby: offers from every office are fetched and the location gate
# keeps the French ones. Workday / SmartRecruiters: only the French postings are asked for
# (country facet / `country=fr`), searched by keyword (settings.yaml →
# sources.ats.search_keywords), at most `max_postings` (default 100) per board and run, each
# with one detail call for its description. Workday on top of that: 15 calls a tenant and
# run, one read a week (a board may carry its own `frequency_days`), and a tenant stopped at
# once when its edge serves the anti-robot page (sources.ats.workday).
boards:
  # Greenhouse — https://boards-api.greenhouse.io/v1/boards/<slug>/jobs?content=true
  - {company: Dataiku,          ats: greenhouse, slug: dataiku}
  - {company: Algolia,          ats: greenhouse, slug: algolia}
  - {company: Ivalua,           ats: greenhouse, slug: ivalua}
  - {company: Platform.sh,      ats: greenhouse, slug: platformsh}
  - {company: Shift Technology, ats: greenhouse, slug: shifttechnology}
  - {company: Mirakl,           ats: greenhouse, slug: mirakl}
  - {company: Dashlane,         ats: greenhouse, slug: dashlane}
  - {company: Datadog,          ats: greenhouse, slug: datadog}
  - {company: Decathlon Technology, ats: greenhouse, slug: decathlontechnology}
  - {company: Shadow,           ats: greenhouse, slug: shadow}
  # Lever — https://api.lever.co/v0/postings/<slug>
