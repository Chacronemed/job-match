# Experience stretch tier. A job whose required years (explicit number, or the minimum a
# seniority keyword implies) exceed the candidate's by at most stretch_years is STRETCH:
# every other gate still applies, it is scored normally, it gets its own digest section
# ("A tenter"), and it is never a strong match. 0 disables the tier; above the band the
# hard gate rejects as before. Measured 2026-10-18 on 533 local jobs (candidate 2 years):
# 25 jobs asked exactly 3, 21 of them scored >= digest.min_score.
experience:
  stretch_years: 1

# Offers reserved for RQTH / BOETH holders ("Poste réservé aux travailleurs handicapés",
# "RQTH obligatoire") are rejected with RESERVED_RQTH. Inclusive wording ("nos postes sont
# ouverts aux personnes en situation de handicap", Talents Handicap) never rejects.
# Measured 2026-10-21 on 337 local eligible/stretch jobs: 0 reserved, 122 inclusive only.
eligibility:
  exclude_rqth_reserved: true
  # Recruiters specialised in placing RQTH candidates: their offers are rejected the same way
  # (company name, or their "<name> accompagne … recrutements de collaborateurs en situation de
  # handicap" sentence). Measured 2026-10-21: Talents Handicap forums, 117 of 337 local
  # eligible/stretch jobs, the end client named in 106. The note keeps the client's name: the
  # same job may exist directly at that company.
  rqth_recruiters:
    - Talents Handicap

digest:
  min_score: 55   # M24: keeps every offer I kept in Tri; below it stays in Offres, out of the Tri and the email
  max_leads: 10   # hiring first, then pre-seed..series B, then most recent; the rest roll over

# Offer lifecycle. Each daily run re-checks every visible France Travail offer against the
# offer-detail endpoint (a closed offer answers HTTP 204, measured 2026-10-19: 6 of the 9
# oldest visible offers were already gone) and hides the closed ones. max_age_days is the
# safety net for offers that were never checked (other sources, failed checks): a posting
# date older than this is hidden from the digest and the dashboard, nothing is deleted.
jobs:
  max_age_days: 45

# Raw source payloads, kept as the API sent them in the private DB only (never logged, never
# in the dashboard). Stored when new or changed since the last copy of the same offer, since
# the 3-day window refetches most offers daily; rows older than retention_days are pruned
# at the end of each jobs run.
raw_payloads:
  retention_days: 60

# The AI rerank (ADR 0016). The calls run in the Cloudflare Worker's cron (worker/src/ai.js),
# which keeps the same values as constants (a test keeps them equal; a `vars` block is not
# allowed in wrangler.jsonc). daily_limit caps the calls per day, retries included;
# disagreement_gap is the AI vs Python score gap that `job-match ai-report` reports;
# prompt_version is bumped with the prompt, so the Worker judges every offer again.
ai:
  daily_limit: 100
  disagreement_gap: 25
  prompt_version: "1"
