# Numeric thresholds — calibrated in M4 and M6 on real data.

strong_threshold: 70
divergence_threshold: 30
dedup_window_days: 30
fuzzy_title_threshold: 0.85
fuzzy_desc_threshold: 0.80
base_score: 50
title_bonus: 10
ft_requests_per_second: 3

# Seniority keywords → minimum required years.  Explicit number in the text wins.
seniority_min_years:
  junior:      0
  débutant:    0
  confirmé:    3
  confirmée:   3
  expérimenté: 3
  senior:      5
  expert:      7
  lead:        5
  principal:   7

scoring:
  jms:
    enabled: false
    commit_sha: null

# Funding pipeline (M10): RSS ingestion. Full article text is never stored.
funding:
  requests_per_second: 1      # article page fetches (polite crawl)
  extract_max_chars: 600      # short extract kept in `articles.extract`
  sources: [maddyness, frenchweb]
