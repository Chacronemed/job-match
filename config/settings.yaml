# Numeric thresholds — calibrated in M4 and M6, recalibrated in M24 on the title families.

strong_threshold: 80   # M24: about the top 20 % of kept offers once titles count (docs/diagnostics/m24-scoring.md)
divergence_threshold: 30
dedup_window_days: 30
fuzzy_title_threshold: 0.85
fuzzy_desc_threshold: 0.80
base_score: 50
title_bonus: 10
ft_requests_per_second: 3

# Job sources. France Travail has a generous quota and runs one query per keyword
# (nationwide, or per department of the profile's location_scope). Jooble and Adzuna have
# small free quotas, so they run one combined query per region, paginated under
# max_calls_per_run. Jooble's location is a literal place filter on a worldwide index:
# an empty location returns the whole world and "France" only the offers whose location
# says "France" (measured 2026-10-18, scripts/jooble_location_probe.py), so the regions
# below are how the national scope is expressed there. Each page is one call, and a
# region gets max_calls_per_run // len(regions) pages, so 26 calls = 2 pages per region.
# Credentials come from the environment only; a source with no key is skipped with a
# warning and the run continues.
sources:
  enabled: [france_travail]   # jooble & adzuna: add here once the plan is paid
  regions:                            # quota-light sources only; metropolitan regions
    - Île-de-France
    - Auvergne-Rhône-Alpes
    - Provence-Alpes-Côte d'Azur
    - Occitanie
    - Nouvelle-Aquitaine
    - Hauts-de-France
    - Grand Est
    - Pays de la Loire
    - Bretagne
    - Normandie
    - Centre-Val de Loire
    - Bourgogne-Franche-Comté
    - Corse
  france_travail:
    # Publication window in days, one of 1, 3, 7, 14, 31 (the API's `publieeDepuis`); the
    # query is sorted newest first. The run is daily, so 3 days covers a missed run and the
    # upsert absorbs an offer seen twice. Offers older than the window are never fetched;
    # after a longer gap, raise it for one run.
    published_since_days: 3
  jooble:
    max_calls_per_run: 26
  adzuna:
    max_calls_per_run: 20

# Seniority keywords → minimum required years.  Explicit number in the text wins.
seniority_min_years:
  junior:      0
  débutant:    0
  confirmé:    3
  confirmée:   3
  expérimenté: 3
  senior:      5
  expert:      7
  lead:        5
  principal:   7

scoring:
  jms:
    enabled: false
    commit_sha: null
  # A skill marked "je maîtrise" on the dashboard joins the preferred skills with this
  # weight on the next run (D1 `skill_overrides`, mirrored before the jobs pipeline).
  override_weight: 2
  # A preferred skill the offer asks for in its "Profil" / "Compétences" section counts its
  # weight times this (rounded half up); a mention elsewhere counts 1x. M24, 1 = off.
  profile_section_multiplier: 1.5

# Funding pipeline (M10): RSS ingestion. Full article text is never stored.
funding:
  requests_per_second: 1      # article page fetches (polite crawl)
  extract_max_chars: 600      # short extract kept in `articles.extract`
  sources: [maddyness, frenchweb]
  lead_dedup_days: 30         # no second Lead for the same company within N days
  job_link_days: 180          # digest flags a job when its company raised within N days
  # Digest-time lead filters. Filtered leads stay in the DB, unnotified (never emailed).
  lead_filters:
    countries: [France]       # explicit foreign country -> filtered; unknown country is kept
    min_amount_eur: null      # e.g. 1000000; unknown amounts always pass
    exclude_sectors: []       # keywords matched in the article title / evidence sentences
    fx_to_eur: {USD: 0.92, GBP: 1.17}  # approximate, only for min_amount_eur

# Relevance gate (before scoring): a job must match >=1 preferred skill OR have one of these
# in its title (accent-insensitive word prefix: "infra" matches "infrastructure").
# Rejected jobs get rejection_reason NOT_RELEVANT. Empty list = gate off.
relevance:
  # Title veto, applied before the skill match below. A dev_title in the title means the
  # job IS a developer role, whatever its description mentions: "Developpeur Java Angular
  # & Cloud" lists our skills but is not our job. It survives only if the title also names
  # an explicit role_title. Note "cloud" alone is NOT a role_title — only "cloud engineer"
  # and "ingenieur cloud" are, so "Developpeur Cloud" is still rejected.
  # Matching is whole-word and accent-insensitive (".net" never matches "network").
  role_titles:
    - devops
    - sre
    - site reliability
    - platform engineer
    - cloud engineer
    - ingénieur cloud
    - infrastructure
    - ops
    - ingénieur système
    - kubernetes
  dev_titles:
    - développeur
    - développeuse
    - developer
    - dev
    - fullstack
    - full stack
    - frontend
    - backend
    - java
    - angular
    - react
    - .net
    - php
    - data scientist
    - data analyst
  target_title_keywords:
    - devops
    - devsecops
    - sre
    - site reliability
    - cloud
    - platform
    - plateforme
    - infra
    - système
    - ingénieur de production informatique
    - exploitation
    - kubernetes
    - ops
    - réseau
    - administrateur
    - linux

# What the title says the job is (M24, docs/diagnostics/m24-scoring.md). Checked in order:
#   1. core (the target family, +core_points) protects the title, unless it also names a
#      core_overrides role (whole words): then it is "other" (-15), never vetoed;
#   2. off_domain (another trade): vetoed at the gate, reason TITLE, even with a near term;
#   3. near (adjacent IT, near_points);
#   4. off_domain_sectors (a sector, not a trade): vetoed only when no core/near term is there;
#   5. else other (other_points: a penalty, not a veto, so the recall stays wide).
# Prefix match, accent- and case-insensitive. When core is set, this replaces title_bonus.
# "exploitation" alone is NOT IT (logistics, hotels, water plants): only its IT forms are near.
# Sector words lose to near on purpose: "restauration" is also a backup restore, "transport"
# also Axway Secure Transport, "marketing" also a data engineer's domain.
title_relevance:
  core_points: 20
  near_points: 10
  other_points: -15
  core:
    - devops
    - devsecops
    - mlops
    - sre
    - site reliability
    - cloud
    - platform
    - plateforme
    - infrastructure
    - infra
    - ops
    - kubernetes
    - k8s
    - aws
    - azure
    - gcp
    - terraform
  near:
    - administrateur système
    - administrateur systèmes
    - administrateur réseau
    - administrateur linux
    - ingénieur système
    - ingénieur systèmes
    - ingénieur réseau
    - ingénieur réseaux
    - systèmes et réseaux
    - système et réseau
    - système réseau
    - systèmes réseaux
    - réseau informatique
    - réseaux et sécurité
    - linux
    - exploitation informatique
    - exploitation it
    - exploitation des systèmes
    - ingénieur d'exploitation
    - production informatique
    - ingénieur de production
    - ingénieur production
    - sysops
    - intégrateur
    - cybersécurité
    - sécurité informatique
    - secops
    - data engineer
    - observabilité
    - finops
    - architecte système
    - architecte systèmes
    - middleware
    - inter-applicatif
    - inter-applicatifs
    - sauvegarde
  # A sales, product, project or recruitment role named next to a core term: the job is
  # that role ("Ingénieur commercial Cloud"), so it is "other", not core. Whole words.
  core_overrides:
    - commercial
    - commerciale
    - sales
    - ingénieur d'affaires
    - ingénieure d'affaires
    - business developer
    - product owner
    - chef de projet
    - cheffe de projet
    - account manager
    - recruteur
    - recruteuse
    - recruiter
  off_domain_sectors:
    - hôtelier
    - hôtel
    - touristique
    - tourisme
    - restauration
    - logistique
    - transport
    - btp
    - bâtiment
    - marketing
  off_domain:
    - recrutement
    - recruteur
    - recruiter
    - talent acquisition
    - commercial
    - technico-commercial
    - business developer
    - vente
    - vendeur
    - mécanique
    - mécanicien
    - fluides
    - hardware
    - électronique
    - électronicien
    - embarqué
    - systèmes embarqués
    - optronique
    - banc de test
    - data manager
    - data analyst
    - analyste de données
    - product owner
    - product manager
    - chef de produit
    - comptab
    - juriste
    - assistance client
    - service client
    - conseiller client
    - relation client
    - logisticien
    - entrepôt
    - magasinier
    - chauffeur
    - conducteur
    - quai
    - chantier
    - génie civil
    - maintenance industrielle
    - automaticien
    - agent de sécurité
