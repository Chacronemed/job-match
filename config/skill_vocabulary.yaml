# Skills worth naming on the dashboard when an offer asks for them and the profile does
# not list them ("non trouvé dans ton profil"). They never change a score on their own:
# "je maîtrise" on the dashboard turns one into a preferred skill (scoring.override_weight).
#
# Canonical names, lowercase. Aliases go in aliases.yaml. Matching is whole-term and
# case-insensitive, so avoid everyday words: "chef" would match "chef de projet", "flux"
# any French text, "go" too many sentences (use golang).

