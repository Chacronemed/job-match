function side(active){return `<aside class="sidebar"><div class="brand"><span class="mark">⌘</span> job-match</div><div class="side-label">Espace personnel</div><nav class="side-nav">${[['Tri','◈','12'],['Offres','▤','47'],['Candidatures','▣','14'],['Leads','◎','8'],['Exécutions','◷','']].map(x=>`<div class="navitem ${x[0]===active?'active':''}"><span class="icon">${x[1]}</span>${x[0]}<em>${x[2]}</em></div>`).join('')}</nav><div class="sep"></div><div class="side-label">Accès rapide</div><div class="navitem"><span class="icon">↗</span>Relances à faire <em>3</em></div><div class="shortcut">Rechercher partout <span class="kbd">⌘ K</span></div><div class="foot">● &nbsp; Dernière collecte réussie<br>6 novembre · 06:30</div></aside>`}

function details(){return `<div class="panel detail"><div class="detailtop"><div class="detail-overline"><span>OFFRE SÉLECTIONNÉE</span><span>⋯ &nbsp;&nbsp; ×</span></div><h2 class="detail-title">Platform Engineer</h2><div class="detail-company">Scality &nbsp;·&nbsp; Paris &nbsp;·&nbsp; Hybride</div><div class="detail-tags"><span class="tag">CDI</span><span class="tag">Cloud &amp; Platform</span><span class="tag">Publiée il y a 2 jours</span></div></div><div class="detail-score"><div><h3>Adéquation avec ton profil</h3><div class="score-number">91<small> / 100</small></div></div><div><div class="score-bar"><i></i></div><div class="score-tag" style="margin-top:8px;color:var(--green)">● Fort match</div></div></div><div class="detail-body"><h3>Pourquoi cette offre te correspond</h3><div class="reason"><span class="dot green"></span><span class="left">Kubernetes</span><span class="right">+18</span></div><div class="reason"><span class="dot green"></span><span class="left">Terraform</span><span class="right">+14</span></div><div class="reason"><span class="dot green"></span><span class="left">GitLab CI / CD</span><span class="right">+12</span></div><div class="reason"><span class="dot green"></span><span class="left">Expérience compatible</span><span class="right">Validée</span></div><div class="divider"></div><h3>Extrait de l'annonce</h3><div class="snippet">« Vous participerez à l'évolution de notre plateforme Kubernetes et à l'automatisation de l'infrastructure via <strong>Terraform</strong>. »</div><div class="notice">◇ <span><strong>Point à vérifier</strong><br>Une connaissance d'AWS est souhaitée. Elle n'est pas indiquée comme obligatoire.</span></div></div><div class="detail-bottom"><button class="btn ghost">Voir l'annonce ↗</button><button class="btn primary">Garder et préparer →</button></div></div>`}
function offres(){return frame('Offres',`<div class="page-top"><div><div class="eyebrow">Ta recherche, organisée</div><h1 class="title">Les opportunités qui comptent</h1><div class="sub">47 offres pertinentes · 21 fortes correspondances · Actualisé aujourd'hui</div></div><div class="top-actions"><button class="btn ghost">Exporter</button><button class="btn primary">Trier les nouvelles &nbsp; ↗</button></div></div><div class="screen-grid"><div class="panel list-panel"><div class="tools"><div class="searchbox">⌕ &nbsp; Rechercher une offre, une entreprise, une compétence <span style="margin-left:auto" class="kbd">/</span></div><div class="tabline"><span class="active">Toutes <b>47</b></span><span>Fortes <b>21</b></span><span>Éligibles <b>18</b></span><span>À tenter <b>8</b></span></div></div><div class="list-caption"><span>OFFRES &nbsp; · &nbsp; TRIÉES PAR SCORE</span><span>Filtres ⌄ &nbsp;&nbsp; ⋮</span></div><div style="overflow:hidden">${rows(9)}</div></div>${details()}</div>`)}
function card(title,company,initial,tag,tagCls,meta){return `<div class="kan-card"><strong>${title}</strong><div class="kan-company"><span class="dot ${tagCls==='red'?'amber':tagCls==='green'?'green':'violet'}"></span> ${company}</div><div class="kmeta"><span>${meta}</span><span class="kpill ${tagCls}">${tag}</span></div><div class="minifooter">↗ &nbsp; Voir la fiche <span style="margin-left:auto">⋯</span></div></div>`}
function board(){return frame('Candidatures',`<div class="page-top"><div><div class="eyebrow">Suivre, relancer, avancer</div><h1 class="title">Candidatures</h1><div class="board-stats"><span><strong>14</strong> dossiers suivis</span><span><strong>3</strong> prochaines actions</span><span><strong>2</strong> entretiens</span></div></div><div class="top-actions"><span class="due-inline">◷ &nbsp; 2 relances en retard</span><button class="btn ghost">Vue tableau</button><button class="btn primary">+ Nouvelle candidature</button></div></div><div class="board-layout"><div class="colkan"><div class="col-head"><i class="dot violet"></i> À candidater <span class="count">4</span></div>${card('Platform Engineer','Scality','SC','CV à préparer','','Ajoutée hier')}${card('SRE / Cloud Reliability','Thales','TH','À compléter','','Ajoutée lundi')}${card('DevOps Engineer','Datadog','DT','Prête','','Ajoutée mardi')}</div><div class="colkan"><div class="col-head"><i class="dot blue"></i> Envoyées <span class="count">6</span></div>${card('Cloud Infrastructure Engineer','OVHcloud','OV','Relance J+9','red','Envoyée le 26 oct.')}${card('DevOps / Kubernetes','Ankorstore','AN','Relance J+7','red','Envoyée le 28 oct.')}${card('Cloud Engineer','Veepee','VI','Réponse attendue','','Envoyée le 3 nov.')}</div><div class="colkan"><div class="col-head"><i class="dot green"></i> Entretiens <span class="count">2</span></div>${card('Platform Reliability Engineer','Qonto','QO','Entretien jeudi','green','Étape technique')}${card('Ingénieur Cloud GCP','Decathlon Tech','DT','Retour attendu','','Premier échange')}</div><div class="colkan"><div class="col-head"><i class="dot amber"></i> En attente / clôturées <span class="count">2</span></div>${card('DevOps Engineer','Contentsquare','CO','En attente','','Dernière action J+12')}${card('Cloud Operations','Ubisoft','UB','Réponse reçue','','Dernière action J+4')}</div></div>`)}
function mShell(active,inner){return `<div class="shell"><main class="main"><div class="mobile-head"><div class="m-brand"><span class="mark">⌘</span> job-match</div><div class="m-actions"><span>⌕</span><span>⋯</span></div></div><div class="viewport"><div class="mobile-content">${inner}</div></div><nav class="m-nav">${[['Tri','◈'],['Offres','▤'],['Candid.','▣'],['Leads','◎'],['Runs','◷']].map(t=>`<div class="${t[0]===active?'active':''}"><span>${t[1]}</span>${t[0]}</div>`).join('')}</nav></main></div>`}
function mOffres(){return mShell('Offres',`<div class="page-top"><div><div class="eyebrow">Tes opportunités</div><h1 class="title">Offres</h1><div class="sub">47 offres · 21 correspondances fortes</div></div></div><div class="m-panel"><div class="m-tools"><div class="searchbox">⌕ &nbsp; Rechercher une offre…</div><div class="m-pills"><span class="active">Toutes 47</span><span>Fortes 21</span><span>À tenter 8</span><span>⚑</span></div></div><div class="list-caption">TRIÉES PAR SCORE <span>Filtres ⌄</span></div>${rows(8)}</div>`)}
function mTri(){return mShell('Tri',`<div class="page-top"><div><div class="eyebrow">Décider vite, sans se tromper</div><h1 class="title">Tri des nouvelles offres</h1><div class="sub">Une opportunité à la fois</div></div></div><div class="m-tri-wrap"><div class="m-tri-steps"><strong>Offre 7 sur 12</strong><span>5 restantes après celle-ci</span></div><div class="tri-progress" style="margin-bottom:14px"><i style="width:58%"></i></div><div class="m-tri-card"><div><span class="big-score">91<small> / 100</small></span><span class="badge">● Fort match</span></div><div><h2>Platform Engineer</h2><div class="company" style="margin-top:7px">Scality &nbsp;·&nbsp; Paris &nbsp;·&nbsp; Hybride</div></div><div class="chips"><span>CDI</span><span>Kubernetes</span><span>Terraform</span><span>GitLab CI</span></div><div class="ledger"><h3>Relevé du score</h3><div class="reason"><span class="dot green"></span><span class="left">Kubernetes</span><span class="right">+18</span></div><div class="reason"><span class="dot green"></span><span class="left">Terraform</span><span class="right">+14</span></div><div class="reason"><span class="dot green"></span><span class="left">GitLab CI / CD</span><span class="right">+12</span></div><div class="reason"><span class="dot green"></span><span class="left">Expérience compatible</span><span class="right">Validée</span></div></div><div class="quote">« Vous travaillerez sur une plateforme Kubernetes et automatiserez son infrastructure avec Terraform. »</div><div style="margin-top:auto;color:var(--sub);font-size:10px">Voir la fiche complète &nbsp; ↗</div></div><div class="m-tri-footer"><button class="danger">← Écarter</button><button class="und">↶</button><button class="primary">Garder →</button></div></div>`)}
function mDetail(){return mShell('Offres',`<div class="page-top"><div><div class="eyebrow">Offre sélectionnée</div><h1 class="title">Fiche de l'offre</h1><div class="sub">← Retour aux 47 offres</div></div></div><div class="m-panel m-details"><h2>Platform Engineer</h2><div class="subhead">Scality · Paris · Hybride · CDI</div><div class="detail-tags"><span class="tag">Kubernetes</span><span class="tag">Terraform</span><span class="tag">GitLab CI</span></div><div class="divider"></div><div style="color:var(--sub);font-size:12px">Adéquation avec ton profil</div><div class="huge">91 <small style="font-size:15px;color:var(--sub);font-weight:400">/ 100</small></div><div style="color:var(--green);font-size:11px;margin:2px 0 21px">● Correspondance forte</div><h3>Pourquoi cette offre te correspond</h3><div class="reason"><span class="dot green"></span><span class="left">Kubernetes</span><span class="right">+18</span></div><div class="reason"><span class="dot green"></span><span class="left">Terraform</span><span class="right">+14</span></div><div class="reason"><span class="dot green"></span><span class="left">GitLab CI / CD</span><span class="right">+12</span></div><div class="reason"><span class="dot green"></span><span class="left">Expérience compatible</span><span class="right">Validée</span></div><div class="divider"></div><h3>Ce que dit l'annonce</h3><div class="quote">« Vous participerez à l'évolution de notre plateforme Kubernetes et à l'automatisation de l'infrastructure via Terraform. »</div><button class="btn primary">Garder et préparer →</button><button class="btn ghost">Voir l'annonce ↗</button></div>`)}
const mode=new URLSearchParams(location.search).get('screen')||'offres';document.body.className=mode.startsWith('mobile')?'mobile':'';document.getElementById('mount').innerHTML=({'offres':offres,'candidatures':board,'mobile-offres':mOffres,'mobile-tri':mTri,'mobile-detail':mDetail}[mode]||offres)();
</script></body></html>
