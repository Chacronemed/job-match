<!doctype html>
<html><head><meta charset="utf-8"><title>Acme - English form</title><script src="/guard.js"></script></head>
<body>
<form id="application-form" action="/submit" method="post">
  <div class="field"><label for="email">Email*</label><input id="email" name="email" type="email"></div>
  <div class="field"><label for="q_auth">Are you legally authorized to work in France?</label>
    <select id="q_auth" name="q_auth"><option value="">Select...</option><option>YES</option><option>NO</option></select></div>
  <fieldset class="field"><legend>Will you require visa sponsorship?</legend>
    <label><input type="radio" name="q_visa" value="1"> Yes, I will need sponsorship</label>
    <label><input type="radio" name="q_visa" value="2"> No, I do not need sponsorship</label></fieldset>
  <div class="field"><label for="q_lic">Which driving licence do you hold?</label>
    <select id="q_lic" name="q_lic"><option value="">Select...</option><option>Driving licence A</option><option>Driving Licence B</option><option>None</option></select></div>
  <div class="field"><label for="q_contract">Preferred contract type</label>
    <select id="q_contract" name="q_contract"><option value="">Select...</option><option>Fixed-term</option><option>Permanent</option><option>Freelance</option></select></div>
  <div class="field"><label for="q_work">Preferred work mode</label>
    <select id="q_work" name="q_work"><option value="">Select...</option><option>On-site</option><option>Hybrid</option><option>Fully remote</option></select></div>
  <button type="submit">Submit application</button>
</form>
</body></html>
