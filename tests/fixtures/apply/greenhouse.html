<!doctype html>
<html><head><meta charset="utf-8"><title>Acme - DevOps</title><script src="/guard.js"></script></head>
<body>
<h1>DevOps Engineer</h1>
<form id="application-form" action="/submit" method="post">
  <div class="field"><label for="first_name">First Name*</label><input id="first_name" name="first_name" required></div>
  <div class="field"><label for="last_name">Last Name*</label><input id="last_name" name="last_name" required></div>
  <div class="field"><label for="email">Email*</label><input id="email" name="email" type="email" required></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
  <div class="field"><label for="resume">Resume/CV*</label><button type="button">Attach</button><input id="resume" name="resume" type="file" style="display:none"></div>
  <div class="field"><label for="cover_letter">Cover Letter</label><input id="cover_letter" name="cover_letter" type="file" style="display:none"></div>
  <div class="field"><label for="question_1">LinkedIn Profile</label><input id="question_1" name="question_1"></div>
  <div class="field"><label for="question_2">Why do you want to work at Acme?*</label><textarea id="question_2" name="question_2"></textarea></div>
  <div class="field"><label for="question_3">What is your notice period?</label><input id="question_3" name="question_3"></div>
  <div class="field"><label for="question_4">Are you legally authorized to work in France?*</label>
    <select id="question_4" name="question_4"><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
  <div class="field"><label for="question_5">What are your salary expectations?</label><input id="question_5" name="question_5"></div>
  <div class="field"><label for="question_6">How did you hear about this job?</label><input id="question_6" name="question_6"></div>
  <div class="field"><label for="gender">Gender</label><select id="gender" name="gender"><option value="">Select...</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select></div>
  <div class="field"><label for="disability_status">Disability Status</label><select id="disability_status" name="disability_status"><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
  <div class="field"><label><input type="checkbox" id="gdpr" name="gdpr"> I agree to the privacy policy</label></div>
  <button type="submit" id="submit_app">Submit application</button>
</form>
</body></html>
