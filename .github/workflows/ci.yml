name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # The Worker and dashboard-tracking tests (worker/test/*.test.mjs) run under Node from
      # pytest (tests/unit/test_worker_js.py); with CI set, a missing Node fails instead of
      # skipping.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
