name: CI

on:
  push:
  pull_request:
    branches: [main]

# A newer push to the same branch / PR supersedes the run in progress (CI writes nothing);
# every commit on main keeps its own result.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Every push: lint + the tests that need neither Chromium nor Node (pytest markers
  # `browser` and `worker`, pyproject.toml), in parallel (pytest-xdist).
  fast:
    name: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # write_site copies the PDF/DOCX renderer's libraries (pdf-lib, fontkit, fflate) from
      # worker/node_modules (ADR 0017): the dashboard render tests need them. No Playwright.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Install
        run: pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q -n auto -m "not browser and not worker"

  # Pull requests and main only: did the change touch what the browser / Worker tests cover?
  # A skipped job counts as passed for a required check, so it can be required on main.
  changes:
    name: changes
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      browser_worker: ${{ steps.diff.outputs.browser_worker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The refs go through env, never interpolated into the script. No base to diff
      # against (a new branch, a force-push) means run.
      - name: Changed paths
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          pattern='^(src/job_match/dashboard/|worker/|tests/unit/browser/|\.github/workflows/)'
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE...$HEAD")
          else
            files="(no base)"
          fi
          if [ "$files" = "(no base)" ] || printf '%s\n' "$files" | grep -Eq "$pattern"; then
            echo "browser_worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser_worker=false" >> "$GITHUB_OUTPUT"
          fi

  # Playwright (dashboard in Chromium, API mocked) + the Worker's Node tests.
  browser-worker:
    name: browser-worker
    needs: changes
    if: needs.changes.outputs.browser_worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The Worker tests (worker/test/*.test.mjs) and its PDF/DOCX renderer (ADR 0017). With
      # CI set, a missing Node or node_modules fails instead of skipping.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Install
        run: pip install ".[dev]"

      - name: Playwright version
        id: pw
        run: |
          echo "version=$(pip show playwright | sed -n 's/^Version: //p')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # With CI set, a missing browser fails instead of skipping. On a cache hit only the
      # system libraries (apt, not cacheable here) are installed.
      - name: Install Chromium for Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Test
        run: pytest -q -n auto -m "browser or worker"
