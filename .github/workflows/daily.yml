name: Daily run

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC every day
  workflow_dispatch:       # manual trigger
    inputs:
      stage:
        description: "What to run: all = jobs, then funding, then site"
        required: false
        default: all
        type: choice
        options: [all, jobs, funding, site]
      reprocess_since:
        description: "Optional YYYY-MM-DD: reprocess data collected since this date (empty = normal run)"
        required: false
        default: ""
        type: string
      reprocess_scope:
        description: "What reprocess_since applies to"
        required: false
        default: jobs
        type: choice
        options: [jobs, funding, both]

# One writer at a time; never cancel a run in progress.
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # The cron has no inputs: it runs all. Each stage's steps check RUN_* ("true"/"false").
    #   jobs    = tracking mirror, France Travail + ATS + other sources, scoring, digest, snapshot
    #   funding = RSS funding pipeline, digest, snapshot
    #   site    = D1 migrations, dashboard rebuilt from the snapshot, deploy
    env:
      STAGE: ${{ inputs.stage || 'all' }}
      RUN_JOBS: ${{ contains(fromJSON('["all","jobs"]'), inputs.stage || 'all') }}
      RUN_FUNDING: ${{ contains(fromJSON('["all","funding"]'), inputs.stage || 'all') }}
      RUN_SITE: ${{ contains(fromJSON('["all","site"]'), inputs.stage || 'all') }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      # Decode the base64 profile secret into config/profile.yaml (gitignored).
      - name: Restore profile
        env:
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
        run: |
          printf '%s' "$PROFILE_YAML" | base64 -d > config/profile.yaml

      # Write the deploy key for job-match-data and add github.com to known_hosts.
      - name: Set up data-repo SSH
        env:
          DATA_REPO_DEPLOY_KEY: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DATA_REPO_DEPLOY_KEY" > ~/.ssh/data_deploy_key
          chmod 600 ~/.ssh/data_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/data_deploy_key -F /dev/null"

      # Diagnostic: the key's fingerprint (never the key) and GitHub's answer to it. With a
      # deploy key `ssh -T` exits 1 after "Hi Chacronemed/job-match-data!": that line is the
      # check, so the exit code is not fatal here; a failing clone right after is.
      - name: Check data-repo key
        run: |
          ssh-keygen -lf ~/.ssh/data_deploy_key
          ssh -T -i ~/.ssh/data_deploy_key -F /dev/null -o IdentitiesOnly=yes git@github.com || true

      - name: Clone data repo
        run: |
          git clone --depth=1 git@github.com:Chacronemed/job-match-data.git data-repo

      # gunzip data-repo/jobs.sqlite.gz into data/ (the legacy plain jobs.sqlite is still
      # read once, on the first run after the switch); no file at all means a fresh start.
      - name: Restore DB
        id: restore
        run: python -m job_match.persistence.snapshot restore --repo data-repo --db data/jobs.sqlite

      # Application tracking lives in D1 (ADR 0012). Apply its migrations (idempotent), then
      # mirror applications, decisions and skill overrides into the jobs DB, before the jobs
      # pipeline: the run merges the overrides into the profile (ADR 0013), and the digest
      # leaves out handled jobs and lists due follow-ups. The export holds my notes and CV links: it goes to a
      # private temp dir, is never printed or uploaded, and is deleted at the end of the
      # step; the import prints counts only. A failed export keeps yesterday's mirror (it
      # travels in the DB snapshot), so neither step can block the digest or the push.
      # Both run wrangler through npx on the runner's preinstalled Node: setup-node and the
      # Worker's npm dependencies are only needed by the deploy (site stage). The migrations
      # run here, before the export, for the jobs stage and for the site stage alike.
      - name: Apply D1 migrations
        id: d1_migrate
        if: env.RUN_JOBS == 'true' || env.RUN_SITE == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4 d1 migrations apply job-match --remote > /dev/null

      - name: Export tracking
        id: tracking
        if: env.RUN_JOBS == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/tracking"
          mkdir -p "$dir"
          trap 'rm -rf "$dir"' EXIT
          d1() { npx --yes wrangler@4 d1 execute job-match --remote --json --command "$1"; }
          d1 "SELECT job_key, status, applied_at, follow_up_at, note, cv_url, updated_at FROM applications" > "$dir/applications.json"
          d1 "SELECT id, job_key, label, score_at_decision, created_at FROM decisions" > "$dir/decisions.json"
          d1 "SELECT skill, created_at FROM skill_overrides" > "$dir/skill_overrides.json"
          d1 "SELECT id, job_key, hash, provider, model, prompt_version, score, level, reasons, red_flags, created_at FROM ai_verdicts" > "$dir/ai_verdicts.json"
          d1 "SELECT day, provider, model, calls, tokens_in, tokens_out FROM ai_usage" > "$dir/ai_usage.json"
          d1 "SELECT id, job_key, hash, python_score, python_section, ai_score, ai_level, kind, created_at FROM disagreements" > "$dir/disagreements.json"
          d1 "SELECT id, started_at, finished_at, outcome, http_status, provider, counters FROM ai_runs" > "$dir/ai_runs.json"
          job-match tracking import --applications "$dir/applications.json" --decisions "$dir/decisions.json" --skill-overrides "$dir/skill_overrides.json" --ai-verdicts "$dir/ai_verdicts.json" --ai-usage "$dir/ai_usage.json" --disagreements "$dir/disagreements.json" --ai-runs "$dir/ai_runs.json"

      # A skill marked "je maîtrise" since the last mirror: re-score the stored jobs still
      # inside the posting-age cut-off, so the change shows today and not only on offers
      # fetched again. No API calls; --limit 0 keeps job titles out of this public log.
      - name: Reprocess for skill overrides
        id: reprocess_overrides
        if: ${{ env.RUN_JOBS == 'true' && steps.tracking.outputs.overrides_changed == 'true' }}
        continue-on-error: true
        run: |
          since=$(python -c "from datetime import date, timedelta; from pathlib import Path; from job_match.config.loader import load_settings; print(date.today() - timedelta(days=load_settings(Path('config/settings.yaml')).jobs.max_age_days))")
          job-match reprocess --since "$since" --limit 0

      # Sources without a secret are skipped with a warning; the run continues on the
      # rest. Which sources are enabled is config/settings.yaml, not this file.
      - name: Run pipeline
        id: pipeline
        if: env.RUN_JOBS == 'true'
        run: job-match run
        env:
          FT_CLIENT_ID:     ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          JOOBLE_API_KEY:   ${{ secrets.JOOBLE_API_KEY }}
          ADZUNA_APP_ID:    ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY:   ${{ secrets.ADZUNA_APP_KEY }}

      # A source that ran and returned nothing three runs in a row (the API changed, the
      # query broke) gets an email; the step writes the job summary and never fails. The
      # job summary itself (fetched per source, rejected per gate, scored, emailed, run
      # time) is written by `job-match run`, `funding run` and `digest` to
      # $GITHUB_STEP_SUMMARY; an exception in a run is announced there and as an error
      # annotation before the step turns red.
      - name: Check sources
        if: always() && env.RUN_JOBS == 'true' && steps.pipeline.outcome != 'skipped'
        continue-on-error: true
        run: job-match ops check-sources --days 3
        env:
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_PORT:     ${{ vars.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO:     ${{ secrets.DIGEST_TO }}

      # Funding pipeline: RSS → articles → FundingEvent → Lead. Needs no secrets.
      # Feed/article failures are counted, never fatal; continue-on-error only guards
      # unexpected crashes so the jobs digest and the DB push still happen.
      - name: Run funding pipeline
        id: funding
        if: env.RUN_FUNDING == 'true'
        continue-on-error: true
        run: job-match funding run

      # Manual runs only: clean the production DB. Drops self-referential duplicate links,
      # re-applies the eligibility gate and re-scores stored jobs; makes no API calls. Runs
      # before the digest so re-admitted jobs go out in this run, and before the checkpoint so
      # the cleaned DB is the one pushed. --limit 0 keeps job titles out of this public log.
      - name: Reprocess jobs
        id: reprocess_jobs
        if: ${{ env.RUN_JOBS == 'true' && github.event_name == 'workflow_dispatch' && inputs.reprocess_since != '' && (inputs.reprocess_scope == 'jobs' || inputs.reprocess_scope == 'both') }}
        continue-on-error: true
        env:
          REPROCESS_SINCE: ${{ inputs.reprocess_since }}
        run: job-match reprocess --since "$REPROCESS_SINCE" --limit 0

      # Manual runs only: re-extract stored articles (e.g. after extractor changes). The DB
      # lives in the data repo, so this must run here. The input goes through an env var,
      # never interpolated into the script; the CLI rejects anything that is not a date.
      - name: Reprocess funding articles
        id: reprocess
        if: ${{ env.RUN_FUNDING == 'true' && github.event_name == 'workflow_dispatch' && inputs.reprocess_since != '' && (inputs.reprocess_scope == 'funding' || inputs.reprocess_scope == 'both') }}
        continue-on-error: true
        env:
          REPROCESS_SINCE: ${{ inputs.reprocess_since }}
        run: job-match funding reprocess --since "$REPROCESS_SINCE"

      # Checkpoint and VACUUM before committing the DB file.
      # Must run after the pipeline closes its connection. Only when a stage wrote the DB:
      # a site-only run reads the snapshot and pushes nothing back.
      - name: WAL checkpoint and VACUUM
        id: wal
        if: env.RUN_JOBS == 'true' || env.RUN_FUNDING == 'true'
        run: |
          python - <<'EOF'
          import sqlite3, pathlib
          p = pathlib.Path("data/jobs.sqlite")
          if p.exists():
              c = sqlite3.connect(str(p))
              c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              c.execute("VACUUM")
              c.close()
          EOF

      # Digest failure (bad config or SMTP error) turns the step red but does not
      # prevent the DB push below — see the always() guard on that step.
      # SMTP_PORT is a repository *variable*: a port is not a secret, and a secret's value
      # is masked everywhere in the log, so "465" would hide every count that equals it.
      # Unset, it expands to "" and the notifier falls back to 465.
      - name: Send digest
        if: env.RUN_JOBS == 'true' || env.RUN_FUNDING == 'true'
        run: job-match digest
        env:
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_PORT:     ${{ vars.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO:     ${{ secrets.DIGEST_TO }}

      # Push the DB back when the WAL checkpoint and VACUUM succeeded, even if the digest
      # failed. gzip, then one orphan commit force-pushed to main: jobs.sqlite.gz plus the
      # previous run's file as jobs.prev.sqlite.gz, so the data repo never accumulates a
      # copy per day. Fails, pushing nothing, when the compressed file is over 90 MB.
      - name: Push DB to data repo
        if: always() && steps.wal.outcome == 'success'
        run: python -m job_match.persistence.snapshot publish --repo data-repo --db data/jobs.sqlite

      # The dashboard is a static snapshot of the DB served by a Cloudflare Worker behind
      # Cloudflare Access (ADR 0009). These steps run even when the digest failed and can
      # never block the DB push above. The repo is public: site/ is never an Actions
      # artifact, nothing in it is printed, and wrangler's stdout (which carries the
      # Worker URL) is discarded; stderr stays so a failed deploy is diagnosable.
      # Site stage only: after jobs / funding it needs their snapshot (wal success); alone,
      # it rebuilds from the restored snapshot. Node and npm ci only run here.
      - name: Set up Node
        if: always() && env.RUN_SITE == 'true' && steps.restore.outcome == 'success' && (steps.wal.outcome == 'success' || env.STAGE == 'site')
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # The Worker bundles its PDF/DOCX libraries (worker/package.json, ADR 0017) at deploy.
      - name: Install Worker dependencies
        if: always() && env.RUN_SITE == 'true' && steps.restore.outcome == 'success' && (steps.wal.outcome == 'success' || env.STAGE == 'site')
        continue-on-error: true
        run: npm ci --prefix worker > /dev/null

      - name: Build dashboard
        id: build
        if: always() && env.RUN_SITE == 'true' && steps.restore.outcome == 'success' && (steps.wal.outcome == 'success' || env.STAGE == 'site')
        continue-on-error: true
        run: job-match dashboard --out site

      - name: Deploy dashboard
        id: deploy
        if: always() && env.RUN_SITE == 'true' && steps.restore.outcome == 'success' && (steps.wal.outcome == 'success' || env.STAGE == 'site')
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ ! -f site/index.html ]; then
            echo "No dashboard build to deploy"
            exit 1
          fi
          npx --yes wrangler@4 deploy > /dev/null
          echo "Dashboard deployed"

      # Which stages were played or skipped, with each stage's main-step outcome. With
      # continue-on-error a failed step's outcome is "failure" even though the job is green.
      - name: Stage summary
        if: always()
        env:
          JOBS_OUTCOME: ${{ steps.pipeline.outcome }}
          FUNDING_OUTCOME: ${{ steps.funding.outcome }}
          SITE_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          {
            echo "### Stages (stage=$STAGE)"
            echo ""
            echo "| Stage | Played | Main step |"
            echo "|---|---|---|"
            for row in "jobs:$RUN_JOBS:$JOBS_OUTCOME" "funding:$RUN_FUNDING:$FUNDING_OUTCOME" "site:$RUN_SITE:$SITE_OUTCOME"; do
              IFS=: read -r name played outcome <<< "$row"
              if [ "$played" = "true" ]; then
                echo "| $name | played | ${outcome:-not reached} |"
              else
                echo "| $name | skipped | - |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
